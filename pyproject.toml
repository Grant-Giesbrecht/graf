[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graf-format"
version = "0.1.0.dev0"
authors = [
  { name="Grant Giesbrecht", email="grant.giesbrecht@colorado.edu" },
]
description = "A platform agnostic way to conveniently preserve scientific graphs."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
	'matplotlib >= 3.9.0',
	'numpy >= 1.24.0',
	'stardust-tools >= 0.2.0',
	'pylogfile >= 0.5.0',
	'colorama >= 0.4.6',
]

# The Qt viewer (graf.widgets, graf-viewer, rich_show) is optional. PyQt6 is a
# large download and nothing in the core save/load path touches it -- `import
# graf` never imports PyQt6, only `import graf.widgets` does. Keeping it out of
# the base install means users who only read and write files do not pay for a
# GUI toolkit they never start.
[project.optional-dependencies]
gui = [
	'PyQt6 >= 6.4.0',
	'mplcursors >= 0.7',
]


test = [
	'pytest >= 7.0',
	'pytest-cov >= 4.0',
]
# Everything needed to run the full suite, including the GUI tests.
dev = [
	'graf-format[gui,test]',
]

[project.urls]
Homepage = "https://github.com/Grant-Giesbrecht/graf"
Issues = "https://github.com/Grant-Giesbrecht/graf/issues"

[project.scripts]
graf-viewer = "graf.scripts.grafviewer:main"
graf-upgrade = "graf.scripts.grafupgrade:main"

[tool.setuptools.packages.find]
where = ["src"]

# Keys here are PACKAGE names. The previous table used arbitrary labels
# ("portable_fonts", "font_suse_reg", ...), which setuptools silently ignored --
# the built wheel shipped no assets at all and `import graf` died on the
# module-level load_fonts() call. Everything under assets/ ships with the
# package; the fonts carry their own licence texts alongside them.
[tool.setuptools.package-data]
"graf" = [
	"assets/*.json",
	"assets/*.png",
	"assets/fonts/*.ttf",
	"assets/fonts/*.otf",
	"assets/fonts/LICENSES/*",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
# The headless Agg backend is selected in tests/conftest.py, which must run
# before any other matplotlib import.
filterwarnings = [
	# GrAF's own warnings are part of its contract -- never let them pass silently.
	"always::UserWarning",
]

[tool.coverage.run]
source = ["graf"]
branch = true

[tool.coverage.report]
exclude_lines = [
	"pragma: no cover",
	"if __name__ == .__main__.:",
	"raise NotImplementedError",
]
